# Dependabot: open a PR for every dependency update, including each minor/patch.
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: master
    schedule:
      # Check daily so every published minor/patch can open a PR promptly.
      interval: daily
      time: "06:00"
      timezone: Asia/Shanghai
    # Allow many concurrent update PRs instead of collapsing/skipping minors.
    open-pull-requests-limit: 20
    # Bump the declared version in package.json (exact pins and ranges).
    versioning-strategy: increase
    # Separate PR per dependency so each minor/patch is reviewable on its own.
    # (No `groups` and no `ignore` update-types.)
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: daily
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 20
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
