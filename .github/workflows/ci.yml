name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Fetch and identify the independent service master
        run: |
          git clone --depth 1 --branch master https://github.com/xz-dev/pi-llm-as-jev.git "$RUNNER_TEMP/judgment"
          git -C "$RUNNER_TEMP/judgment" rev-parse HEAD
          npm ci --prefix "$RUNNER_TEMP/judgment"
          cmp src/judgment-client.ts "$RUNNER_TEMP/judgment/client/judgment-client.ts"
          echo "PI_JUDGMENT_SOURCE=$RUNNER_TEMP/judgment" >> "$GITHUB_ENV"
          cd "$RUNNER_TEMP/judgment"
          node --import tsx --input-type=module -e 'import assert from "node:assert/strict"; import {createJudgmentService} from "./src/service.ts"; const s=createJudgmentService({}); assert.equal(s.version,2); assert.equal(s.capacityVersion,2)'
      - run: npm run check
      - run: npm run test:e2e
      - name: Verify Git-source package contents
        run: |
          npm pack --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/package.json"
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const [pack] = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/package.json"));
            const files = new Set(pack.files.map(f => f.path));
            for (const file of ["src/extension.ts", "src/unlock-review.ts", "src/judgment-client.ts", "README.md"]) assert(files.has(file), file);
            for (const file of files) assert(!/^(test\/|PLAN\/|\.serena\/)/.test(file), file);
            assert.equal(JSON.parse(fs.readFileSync("package.json")).private, true);
            console.log(pack.filename, pack.integrity, pack.files.length);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: git-source-package
          path: ${{ runner.temp }}/pi-continue-watchdog-*.tgz
          if-no-files-found: error
      - name: Verify npm 12 Git-clone install policy
        run: |
          install_root="$(mktemp -d)"
          git clone --local . "$install_root/pi-continue-watchdog"
          cd "$install_root/pi-continue-watchdog"
          # Exercise npm 12's nested-preparation failure mode with the
          # package-owned allowScripts policy and a clean cache. A
          # preparation-free Git dependency must not turn that project policy
          # into a forbidden child-install CLI policy.
          NPM_CONFIG_CACHE="$install_root/npm-cache" npx --yes npm@12.0.2 install --omit=dev --no-audit --no-fund
          node --input-type=module -e 'import("pi-extension-utils/process-domain").then((module) => { if (typeof module.openProcessDomain !== "function") process.exit(1); })'
          # The private runtime must be prepared by the utils postinstall.
          node -e 'const p=require("./node_modules/private-inquiry-subagents-runtime/package.json"); if (!p.exports?.["./watchdog-runtime"]) process.exit(1)'
      - name: Install the released standalone Pi exactly as users get it
        run: |
          # The xz-dev standalone Pi installs Git packages with its embedded Bun, which
          # blocks untrusted dependency scripts. npm-only checks passed d7edcc8, which
          # then failed to load for users. Verify the release checksum, then install
          # this commit with the real binary.
          release=xz-v1.3.0-xz.339.1.g12ba93b4
          dir="$RUNNER_TEMP/pi-release"
          mkdir -p "$dir" && cd "$dir"
          gh release download "$release" -R xz-dev/pi -p pi-linux-x64-gnu-baseline.zip -p SHA256SUMS
          grep ' pi-linux-x64-gnu-baseline.zip$' SHA256SUMS | sha256sum -c -
          unzip -q pi-linux-x64-gnu-baseline.zip
          ./pi --version
          sha256sum ./pi
          echo "PI_BIN=$dir/pi" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Real pi install and load of this commit (clean agent dir, git+sh only)
        run: |
          # Serve this exact commit from a local Git daemon; Pi installs Git sources by URL.
          root="$RUNNER_TEMP/git-serve"
          mkdir -p "$root/ci/pi-continue-watchdog"
          git clone --bare --quiet . "$root/ci/pi-continue-watchdog/.git"
          git daemon --reuseaddr --base-path="$root" --export-all --port=19418 --listen=127.0.0.1 --detach --pid-file="$RUNNER_TEMP/git-daemon.pid"
          for i in $(seq 1 20); do git ls-remote git://127.0.0.1:19418/ci/pi-continue-watchdog >/dev/null 2>&1 && break; sleep 0.5; done
          HOME="$(mktemp -d)" scripts/pi-install-smoke.sh "git:git://127.0.0.1:19418/ci/pi-continue-watchdog@$(git rev-parse HEAD)"
