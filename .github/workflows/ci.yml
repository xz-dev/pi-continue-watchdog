name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:e2e
      - name: Verify npm 12 Git-clone install policy
        run: |
          install_root="$(mktemp -d)"
          git clone --local . "$install_root/pi-continue-watchdog"
          cd "$install_root/pi-continue-watchdog"
          # Exercise npm 12's nested-preparation failure mode with the
          # package-owned allowScripts policy and a clean cache. A
          # preparation-free Git dependency must not turn that project policy
          # into a forbidden child-install CLI policy.
          NPM_CONFIG_CACHE="$install_root/npm-cache" npx --yes npm@12.0.2 install --omit=dev --no-audit --no-fund
          node --input-type=module -e 'import("pi-process-domain").then((module) => { if (typeof module.openDomain !== "function") process.exit(1); })'
